<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Pro Max | Engineering Edition</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginSection" class="auth-screen">
    <div class="glass-card login-box">
        <div class="shimmer"></div>
        <h1>Barber<span>Admin</span></h1>
        <form id="loginForm">
            <input type="text" id="user" placeholder="Usuario" required>
            <input type="password" id="pass" placeholder="Contraseña" required>
            <button type="submit" class="btn-glow">ACCEDER</button>
        </form>
    </div>
</div>

<div id="dashboardSection" style="display: none;">
    <aside class="sidebar">
        <div class="brand-logo">💈 PRO</div>
        <nav>
            <div class="nav-item active" onclick="showTab('agenda')">📅 Agenda</div>
            <div class="nav-item" onclick="showTab('servicios')">✂️ Servicios</div>
        </nav>
        <button onclick="logout()" class="btn-exit">Salir</button>
    </aside>

    <main class="main-content">
        <div id="tab-agenda" class="tab-content">
            <div class="header-main">
                <h2>Panel de Control</h2>
                <p>Sincronización en tiempo real activa</p>
            </div>

            <div class="dashboard-grid">
                <section class="glass-card">
                    <h3>Agendar Cita</h3>
                    <form id="appointmentForm">
                        <input type="text" id="nombre" placeholder="Nombre del Cliente" required>
                        <input type="datetime-local" id="fecha" required>

                        <label class="label-tiny">SERVICIO:</label>
                        <div class="service-bubbles">
                            <div class="bubble" onclick="selectService(this, 'Corte')">✂️ Corte</div>
                            <div class="bubble" onclick="selectService(this, 'Barba')">🧔 Barba</div>
                            <div class="bubble" onclick="selectService(this, 'Combo')">🔥 Combo</div>
                            <div class="bubble" onclick="selectService(this, 'Facial')">🧴 Facial</div>
                        </div>

                        <button type="submit" class="btn-primary">REGISTRAR CITA</button>
                    </form>
                </section>

                <section class="glass-card">
                    <h3>Próximas Citas</h3>
                    <div id="appointmentsList" class="scroll-list"></div>
                </section>
            </div>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
