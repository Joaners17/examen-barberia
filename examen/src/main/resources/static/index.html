<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Barber Cloud | Enterprise Edition</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<section id="loginSection" class="auth-wrapper">
    <div class="glass-card login-box">
        <div class="logo-area">
            <span class="icon">✂️</span>
            <h1>Zenith<span>Admin</span></h1>
        </div>
        <form id="loginForm">
            <div class="input-field">
                <input type="text" id="user" placeholder=" " required>
                <label>Usuario</label>
            </div>
            <div class="input-field">
                <input type="password" id="pass" placeholder=" " required>
                <label>Contraseña</label>
            </div>
            <button type="submit" class="btn-glow">ACCEDER AL SISTEMA</button>
        </form>
    </div>
</section>

<section id="dashboardSection" class="main-layout" style="display: none;">
    <aside class="sidebar">
        <div class="user-info">
            <div class="avatar" id="avatarIcon">J</div>
            <div class="user-text">
                <h4 id="displayUserName">Joan Eras</h4>
                <span class="status-online">Online</span>
            </div>
        </div>
        <nav class="nav-menu">
            <button class="nav-btn active" onclick="showTab('agenda')">📅 Agenda Citas</button>
            <button class="nav-btn" onclick="showTab('servicios')">✂️ Lista Servicios</button>
            <button class="nav-btn" onclick="showTab('stats')">📊 Reportes</button>
        </nav>
        <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
    </aside>

    <main class="content-area">
        <div id="tab-agenda" class="tab-pane active">
            <header class="view-header">
                <h2>Gestión de Citas</h2>
                <p id="liveClock"></p>
            </header>

            <div class="split-view">
                <div class="glass-card">
                    <h3>Nueva Reservación</h3>
                    <form id="appointmentForm">
                        <input type="text" id="nombre" placeholder="Nombre del Cliente" class="m-input" required>
                        <input type="datetime-local" id="fecha" class="m-input" required>

                        <div class="duration-control">
                            <label>Duración: <span id="durValue">30</span> min</label>
                            <input type="range" id="duracion" min="15" max="120" step="15" value="30">
                        </div>

                        <p class="label-s">SERVICIO</p>
                        <div class="bubbles">
                            <div class="b-opt" onclick="setS(this, 'Corte')">Corte</div>
                            <div class="b-opt" onclick="setS(this, 'Barba')">Barba</div>
                            <div class="b-opt" onclick="setS(this, 'Combo')">Combo</div>
                        </div>
                        <button type="submit" class="btn-action">CONFIRMAR</button>
                    </form>
                </div>

                <div class="glass-card">
                    <h3>Citas en Proceso</h3>
                    <div id="appointmentsList" class="scroll-v"></div>
                </div>
            </div>
        </div>

        <div id="tab-servicios" class="tab-pane">
            <h2>Servicios Disponibles</h2>
            <div class="services-grid">
                <div class="s-card"><h4>Corte Clásico</h4><p>₡7,000</p></div>
                <div class="s-card"><h4>Degradado Pro</h4><p>₡9,000</p></div>
                <div class="s-card"><h4>Barba King</h4><p>₡5,000</p></div>
            </div>
        </div>

        <div id="tab-stats" class="tab-pane">
            <h2>Análisis de Rendimiento</h2>
            <div class="stat-box">
                <p>Total Citas Hoy: <strong id="totalCount">0</strong></p>
            </div>
        </div>
    </main>
</section>

<script src="js/app.js"></script>
</body>
</html>
